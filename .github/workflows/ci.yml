name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest-and-skills:
    name: 清单与技能资产校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 语法检查 index.js
        run: node --check index.js

      - name: 解析 JSON 清单
        run: |
          node -e "const fs=require('fs');for(const p of ['package.json','locale/zh.json','locale/en.json']){JSON.parse(fs.readFileSync(p,'utf8'));}console.log('JSON OK')"

      - name: 校验清单与技能一致性
        run: node scripts/verify-manifest.mjs

      - name: 确认 references 下只有公开文件被跟踪
        run: |
          unexpected=$(git ls-files | grep '/references/' | grep -vE 'references/(topic-index-lite|writing-rules)\.md$' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::unexpected tracked reference files:"
            echo "$unexpected"
            exit 1
          fi
          echo "only public reference files are tracked"

  word-script:
    name: 生成脚本端到端测试（Windows PowerShell 5.1）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # 注意：GitHub 把 run 脚本写成无 BOM 的临时 .ps1，Windows PowerShell 5.1 会按 ANSI 误读其中的中文。
      # 因此本作业的驱动脚本一律只用 ASCII 报错信息，并显式用 powershell.exe（5.1）执行被测脚本。
      - name: Check that the script keeps its UTF-8 BOM
        shell: pwsh
        run: |
          $script = Join-Path $PWD 'assets/ruankao-essay-writing/scripts/make-essay-doc.ps1'
          $bytes = [System.IO.File]::ReadAllBytes($script)
          $hasBom = $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
          if (-not $hasBom) { throw 'make-essay-doc.ps1 must be saved as UTF-8 with BOM' }
          Write-Host "BOM ok ($($bytes.Length) bytes)"

      - name: Generate a .doc with Windows PowerShell 5.1 and assert the output
        shell: pwsh
        run: |
          $root = $PWD.Path
          $script = Join-Path $root 'assets/ruankao-essay-writing/scripts/make-essay-doc.ps1'
          $fixture = Join-Path $root 'tests/fixtures/sample-essay.md'
          $out = Join-Path $root 'tests/out/sample.doc'
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'tests/out') | Out-Null

          $output = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -MdPath $fixture -OutPath $out
          $output | ForEach-Object { Write-Host $_ }

          if (-not (Test-Path $out)) { throw 'sample.doc was not produced' }

          $doc = Get-Content -LiteralPath $out -Raw
          $paragraphs = [regex]::Matches($doc, '<p>').Count
          if ($paragraphs -ne 10) { throw "expected 10 paragraphs, got $paragraphs" }

          # Only the body matters: straight quotes inside HTML attributes are expected.
          $body = [regex]::Match($doc, '(?s)<body>(.*)</body>').Groups[1].Value
          $straight = [regex]::Matches($body, '"').Count
          $chinese = [regex]::Matches($body, "[\u201C\u201D]").Count
          Write-Host "body: straight quotes = $straight, chinese quotes = $chinese"
          if ($straight -ne 0) { throw 'body still contains straight quotes' }
          if ($chinese -eq 0) { throw 'straight quotes in the fixture were not converted' }

          Write-Host 'end-to-end test passed'
